# Lint for addons built by Addon_Factory. Addons listed in `exclude` were written before it
# and are not reformatted; remove a line once that addon is cleaned up.
# Run: pre-commit run --files $(find <addon> -type f)   (or `pre-commit install` to run on each commit)
exclude: |
  (?x)^(
    language_change/|
    log_real_ip/|
    module_version/|
    simple_online_users/|
    user_permission_copy/
  )
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
  - repo: https://github.com/OCA/pylint-odoo
    rev: v10.0.12
    hooks:
      - id: pylint_odoo
        args: [--rcfile=.pylintrc-mandatory]
  - repo: https://github.com/OCA/odoo-pre-commit-hooks
    rev: v0.2.27
    hooks:
      - id: oca-checks-odoo-module
        args: [--disable=prefer-readme-rst]  # README.md on purpose (GitHub page)
